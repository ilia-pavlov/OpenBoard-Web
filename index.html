<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E13" />
    <meta name="description" content="Fast US Chess ratings: your card, rating history and player search." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OpenBoard</title>
    <script>
      // Apply the saved appearance before first paint (dark by default, like the app).
      let a = 'dark'
      try { const saved = localStorage.getItem('appearance'); if (['dark', 'light', 'system'].includes(saved)) a = saved } catch {}
      if (a !== 'system') document.documentElement.dataset.theme = a
    </script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/"><span class="brand-mark">♛</span> OpenBoard</a>
      <nav class="tabs" aria-label="Main">
        <a href="#/" data-tab="card">My Card</a>
        <a href="#/events" data-tab="events">Events</a>
        <a href="#/search" data-tab="search">Search</a>
      </nav>
      <button class="appearance" type="button" aria-label="Appearance"></button>
    </header>
    <main id="app" tabindex="-1"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
